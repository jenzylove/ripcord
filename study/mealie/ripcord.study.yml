project: study-mealie
composeFile: docker-compose.yml
appUrl: http://localhost:9961
appService: mealie
loginVars:
  email: STUDY_EMAIL
  password: STUDY_PASSWORD
databases:
  - service: postgres
    engine: postgres
    user: mealie
    db: mealie
volumes: [mealie-data]
vault: C:/Users/LENOVO/ripcord/vault/study-mealie
checks:
  - id: recipe_photo
    ask: "Log in with email {{email}} and password {{password}}. Open the recipe named 'Party Jollof Rice' and look at the recipe photo at the top."
    assert: "the recipe photo at the top shows an image, not a missing, blank or broken image placeholder"
