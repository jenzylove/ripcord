project: study-n8n
composeFile: docker-compose.yml
appUrl: http://localhost:9941
appService: n8n
loginVars:
  email: STUDY_EMAIL
  password: STUDY_PASSWORD
databases: []
volumes: []
vault: C:/Users/LENOVO/ripcord/vault/study-n8n
checks:
  - id: login
    ask: "Go to the sign in page and log in with email {{email}} and password {{password}}."
    assert: "the login succeeds and the n8n workspace (Overview or Workflows page) is shown, not the sign in page or an error"
  - id: credential
    ask: "Log in with email {{email}} and password {{password}}. Open the Credentials page and open the credential named 'Acme Billing API key'."
    assert: "the credential opens and its form shows its fields without any error message or red banner"
