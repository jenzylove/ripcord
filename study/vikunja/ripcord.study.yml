project: study-vikunja
composeFile: docker-compose.yml
appUrl: http://localhost:9962
appService: vikunja
loginVars:
  username: STUDY_USERNAME
  password: STUDY_PASSWORD
databases: []
volumes: []
vault: C:/Users/LENOVO/ripcord/vault/study-vikunja
checks:
  - id: login_and_tasks
    ask: "Log in with username {{username}} and password {{password}}. Open the project 'Launch Plan'."
    assert: "the login succeeds and the project 'Launch Plan' shows 5 tasks"
  - id: attachment
    ask: "Log in with username {{username}} and password {{password}}. Open the project 'Launch Plan', open the task 'Book venue' and look at its attachments."
    assert: "the attachment venue-floorplan.png is listed and shows a preview image, not an error or a broken image"
