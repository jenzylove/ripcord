<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ripcord run replay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ea;--ink:#17171a;--mute:#6b6b70;--org:#ff5a1f;--term:#141414;--termink:#e8e6df;--good:#7ee2a8;--bad:#ff8a6a}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--ink:#ecebe6;--mute:#9a9aa2}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
main{max-width:1040px;margin:0 auto;padding:28px 16px}
h1{font:800 40px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:0 0 6px;letter-spacing:.5px}
.sub{color:var(--mute);font-size:14px;margin-bottom:16px}.sub a{color:inherit}
.tag{display:inline-block;border:2px solid var(--org);color:var(--org);font:600 12px 'IBM Plex Mono',monospace;padding:2px 8px;margin-bottom:12px;text-transform:uppercase}
#term{background:var(--term);color:var(--termink);font:15px/1.55 'IBM Plex Mono',monospace;padding:20px 22px;min-height:520px;white-space:pre-wrap;word-break:break-word;border-left:6px solid var(--org)}
.cmd{color:#fff;font-weight:600}.cmd::before{content:'$ ';color:var(--org)}
.ok{color:var(--good);font-weight:600}.bad{color:var(--bad);font-weight:600}.dim{color:#8d8b85}.agent{color:#b9d4ff}
.big{font-size:22px}
</style>
</head>
<body>
<main>
<span class="tag">Replay of a real logged run</span>
<h1 id="title">Loading</h1>
<div class="sub" id="sub"></div>
<div id="term"></div>
</main>
<script>
const q = new URLSearchParams(location.search);
const name = (q.get('run') || 'fix').replace(/[^a-z0-9-]/gi, '');
const speed = Number(q.get('speed') || 1);
const term = document.getElementById('term');
function cls(line){
  if (line.startsWith('$ ')) return 'cmd';
  if (/^(PROVEN|ROLLED BACK)/.test(line) || /: PASS\b|allowed/.test(line)) return 'ok big';
  if (/^(LOSS|DATA CHANGED|INCONCLUSIVE)|blocked/i.test(line)) return 'bad big';
  if (line.startsWith('Claude:') || line.startsWith('Claude Code:')) return 'agent';
  if (/^\[|^ +/.test(line)) return 'dim';
  return '';
}
fetch(`runs/${name}.json`).then(r => r.json()).then(async run => {
  document.title = `Ripcord replay: ${run.title}`;
  document.getElementById('title').textContent = run.title;
  document.getElementById('sub').innerHTML = `Recorded ${run.recordedAt}. Lines shown at replay speed; waits for Kane runs and restores are shortened. <a href="${run.fullLog}">Full log</a>`;
  for (const l of run.lines) {
    await new Promise(res => setTimeout(res, (l.wait ?? 450) / speed));
    const div = document.createElement('div');
    const c = cls(l.text); if (c) div.className = c;
    div.textContent = l.text.startsWith('$ ') ? l.text.slice(2) : l.text;
    term.appendChild(div);
    window.scrollTo(0, document.body.scrollHeight);
  }
  window.__replayDone = true;
}).catch(() => { document.getElementById('title').textContent = 'Replay not found'; window.__replayDone = true; });
</script>
</body>
</html>
